<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Приховуємо Referer, щоб сервери не блокували запити з WebApp/локальних файлів -->
    <meta name="referrer" content="no-referrer">
    <title>INTERNET RADIO</title>
    <!-- Підключаємо Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #00ff88;
            text-align: center;
            padding: 16px;
            margin: 0;
            user-select: none;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .container {
            max-width: 480px;
            margin: 0 auto;
            width: 100%;
        }

        .screen {
            background-color: #000;
            padding: 18px 12px;
            border-radius: 12px;
            font-weight: 700;
            margin-bottom: 16px;
            border: 1px solid #00ff8844;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.1);
            letter-spacing: 0.5px;
            font-size: 15px;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
        }

        /* Кнопки керування відтворенням */
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }

        .btn-ctrl {
            background-color: #1e1e1e;
            color: #00ff88;
            border: 1px solid #00ff8866;
            padding: 12px 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        .btn-ctrl:active {
            transform: scale(0.96);
            background-color: #252525;
        }

        .btn-stop {
            background-color: #2a1113;
            color: #ff4d4d;
            border: 1px solid #ff4d4d66;
        }
        .btn-stop:active {
            background-color: #3d171a;
        }

        .vol-box {
            background: #1e1e1e;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #333;
        }
        .vol-box label {
            font-size: 12px;
            font-weight: bold;
            color: #888;
            white-space: nowrap;
        }
        .vol-box input[type="range"] {
            width: 100%;
            accent-color: #00ff88;
            cursor: pointer;
        }

        h3 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin: 0 0 10px 0;
            text-align: left;
        }

        .playlist {
            background-color: #181818;
            border-radius: 10px;
            overflow-y: auto;
            text-align: left;
            border: 1px solid #282828;
            max-height: 40vh;
            margin-bottom: 20px;
        }

        .station-item {
            padding: 14px 16px;
            border-bottom: 1px solid #222;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ddd;
            font-size: 15px;
            transition: background 0.2s;
        }
        .station-item:last-child {
            border-bottom: none;
        }
        .station-item:hover {
            background-color: #252525;
        }
        .station-item.active {
            background-color: #00ff8815;
            color: #00ff88;
            font-weight: bold;
        }
        .station-item .actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .station-item .icon {
            font-size: 12px;
            opacity: 0.6;
        }
        .station-item.active .icon {
            opacity: 1;
        }
        .btn-del {
            color: #ff4d4d;
            font-size: 14px;
            opacity: 0.5;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .btn-del:hover {
            opacity: 1;
            background: #ff4d4d22;
        }

        /* Форма додавання власної станції */
        .add-box {
            background: #181818;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #282828;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .add-box input {
            background: #101010;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .add-box input:focus {
            border-color: #00ff88;
        }
        .btn-add {
            background-color: #00ff8822;
            color: #00ff88;
            border: 1px solid #00ff8866;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-add:active {
            background-color: #00ff8844;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="screen" id="status">ОБЕРІТЬ СТАНЦІЮ</div>
        
        <!-- Керування програвачем -->
        <div class="controls-grid">
            <button class="btn-ctrl" id="prev-btn">⏮ НАЗАД</button>
            <button class="btn-ctrl btn-stop" id="stop-btn">■ СТОП</button>
            <button class="btn-ctrl" id="next-btn">ВПЕРЕД ⏭</button>
        </div>

        <div class="vol-box">
            <label>ГУЧНІСТЬ</label>
            <input type="range" id="volume-slider" min="0" max="100" value="70">
        </div>

        <h3>Список радіостанцій</h3>
        
        <!-- Список радіостанцій -->
        <div class="playlist" id="playlist"></div>

        <!-- Додавання власної станції -->
        <h3>Додати станцію</h3>
        <div class="add-box">
            <input type="text" id="custom-name" placeholder="Назва станції">
            <input type="url" id="custom-url" placeholder="URL потоку (https://...)">
            <button class="btn-add" id="add-btn">+ ДОДАТИ СТАНЦІЮ</button>
        </div>
    </div>

    <!-- Тег audio без атрибута crossorigin="anonymous" для уникнення CORS-помилок -->
    <audio id="audio-player" preload="none"></audio>

    <script>
        // Початковий список станцій за замовчуванням
        const defaultStations = [
            { name: "Радіо ТРЕК", stream: "https://cast.radiotrek.rv.ua:8433/AAC%2B_64" },
            { name: "Радіо ЗАБАВА", stream: "https://lux.radio.tvstitch.com/radio-zabava-sd?npa=1" },
            { name: "Радіо Люкс ФМ", stream: "https://lux.radio.tvstitch.com/kyiv/lux_adv_sd?npa=1" },
            { name: "Радіо Люкс ФМ - Romantic", stream: "https://lux.radio.tvstitch.com/lux-fm-romantic-sd?npa=1" },
            { name: "Радіо Люкс ФМ - Chill & Relax", stream: "https://icecast.luxnet.ua/chill-sd" },
            { name: "Радіо Люкс ФМ - Українські хіти", stream: "https://icecast.luxnet.ua/ukrayinski-hiti-sd?npa=1" },
            { name: "Радіо Люкс ФМ - DANCE", stream: "https://lux.radio.tvstitch.com/lux-fm-dance-sd?npa=1" },
            { name: "Радіо Люкс ФМ - Золоті хіти", stream: "https://lux.radio.tvstitch.com/zoloti-hiti-sd?npa=1" },
            { name: "Радіо Люкс ФМ - Сучасні хіти", stream: "https://icecast.luxnet.ua/suchasni-hiti-sd?npa=1" },
            { name: "Радіо Люкс ФМ - Тільки люкс хіти", stream: "https://lux.radio.tvstitch.com/tilky-hity-sd?npa=1" },
            { name: "Радіо Люкс ФМ - SPORT", stream: "https://lux.radio.tvstitch.com/lux-fm-sport-sd?npa=1" },
            { name: "Радіо Перець ФМ", stream: "https://radio.perec.fm/radio-stilnoe" },
            { name: "Радіо Максимум", stream: "https://lux.radio.tvstitch.com/kyiv/max_adv_sd?npa=1" },
            { name: "ХІТ ФМ", stream: "https://tavr.tvstitch.com/HitFM?npa=1" },
            { name: "Авторадіо", stream: "https://cast.mediaonline.net.ua/avtoradio" },
            { name: "Радіо Європа +", stream: "https://s5.radioforge.com:7908/live?npa=1" },
            { name: "Радіо Dance FM", stream: "https://lux.radio.tvstitch.com/dance-fm-sd?npa=1" },
            { name: "Радіо FITNESS FM", stream: "https://lux.radio.tvstitch.com/fitness-fm-sd?npa=1" }
        ];

        // Завантаження користувацьких станцій з localStorage
        let customStations = JSON.parse(localStorage.getItem('custom_radio_stations')) || [];
        let currentIndex = -1; // -1 означає, що нічого не відтворюється

        // Ініціалізація Telegram WebApp
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.expand();
                window.Telegram.WebApp.ready();
            }
        } catch(e) {}

        const player = document.getElementById('audio-player');
        const statusText = document.getElementById('status');
        const volumeSlider = document.getElementById('volume-slider');
        const stopButton = document.getElementById('stop-btn');
        const prevButton = document.getElementById('prev-btn');
        const nextButton = document.getElementById('next-btn');
        const playlistContainer = document.getElementById('playlist');
        const addBtn = document.getElementById('add-btn');
        const customNameInput = document.getElementById('custom-name');
        const customUrlInput = document.getElementById('custom-url');

        // Встановлення початкової гучності
        player.volume = volumeSlider.value / 100;

        volumeSlider.addEventListener('input', function() {
            player.volume = this.value / 100;
        });

        // Отримання всіх станцій (за замовчуванням + додані користувачем)
        function getAllStations() {
            return [...defaultStations, ...customStations];
        }

        // Ініціалізація системних команд для iOS Lock Screen / Control Center / Apple Watch
        function setupMediaSession() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.setActionHandler('play', () => {
                    if (currentIndex !== -1) player.play();
                });
                navigator.mediaSession.setActionHandler('pause', () => {
                    player.pause();
                });
                navigator.mediaSession.setActionHandler('previoustrack', () => {
                    playPrev();
                });
                navigator.mediaSession.setActionHandler('nexttrack', () => {
                    playNext();
                });
            }
        }

        // Оновлення метаданих для заблокованого екрана iOS та Apple Watch
        function updateMediaSessionMetadata(stationName) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: stationName,
                    artist: 'Інтернет Радіо',
                    album: 'Прямий ефір'
                });
            }
        }

        // Відображення списку станцій
        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            const allStations = getAllStations();

            allStations.forEach((station, index) => {
                const item = document.createElement('div');
                item.className = 'station-item' + (index === currentIndex ? ' active' : '');
                
                const isCustom = index >= defaultStations.length;
                const deleteBtnHtml = isCustom ? `<span class="btn-del" data-custom-index="${index - defaultStations.length}">✖</span>` : '';

                item.innerHTML = `
                    <span>${station.name}</span>
                    <div class="actions">
                        ${deleteBtnHtml}
                        <span class="icon">${index === currentIndex ? '🔊' : '▶'}</span>
                    </div>
                `;

                // Клік по станції для відтворення
                item.addEventListener('click', (e) => {
                    if (e.target.classList.contains('btn-del')) return;
                    playStation(index);
                });

                // Клік по кнопці видалення користувацької станції
                if (isCustom) {
                    const delBtn = item.querySelector('.btn-del');
                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteCustomStation(index - defaultStations.length);
                    });
                }

                playlistContainer.appendChild(item);
            });
        }

        // Функція відтворення за індексом
        function playStation(index) {
            const allStations = getAllStations();
            if (index < 0 || index >= allStations.length) return;

            currentIndex = index;
            const station = allStations[currentIndex];

            renderPlaylist();
            statusText.innerText = "ПІДКЛЮЧЕННЯ...";

            // Оновлюємо відображення на iOS та Apple Watch
            updateMediaSessionMetadata(station.name);

            player.pause();
            player.src = station.stream;
            player.load();

            player.play()
                .then(() => {
                    statusText.innerText = "ГРАЄ: " + station.name.toUpperCase();
                })
                .catch(error => {
                    statusText.innerText = "ПОМИЛКА ПОТОКУ";
                    renderPlaylist();
                    console.error("Помилка відтворення:", error);
                });
        }

        // Функції переключення станцій
        function playPrev() {
            const allStations = getAllStations();
            if (allStations.length === 0) return;
            
            let newIndex = currentIndex - 1;
            if (newIndex < 0) {
                newIndex = allStations.length - 1;
            }
            playStation(newIndex);
        }

        function playNext() {
            const allStations = getAllStations();
            if (allStations.length === 0) return;

            let newIndex = currentIndex + 1;
            if (newIndex >= allStations.length) {
                newIndex = 0;
            }
            playStation(newIndex);
        }

        // Переключення кнопками сайту
        prevButton.addEventListener('click', playPrev);
        nextButton.addEventListener('click', playNext);

        // Зупинка відтворення
        stopButton.addEventListener('click', function() {
            player.pause();
            player.src = "";
            currentIndex = -1;
            statusText.innerText = "ЗУПИНЕНО";
            renderPlaylist();
        });

        // Додавання власної станції користувачем
        addBtn.addEventListener('click', function() {
            const name = customNameInput.value.trim();
            const stream = customUrlInput.value.trim();

            if (!name || !stream) {
                alert("Будь ласка, введіть назву та URL потоку.");
                return;
            }

            customStations.push({ name, stream });
            localStorage.setItem('custom_radio_stations', JSON.stringify(customStations));

            customNameInput.value = '';
            customUrlInput.value = '';

            renderPlaylist();
        });

        // Видалення користувацької станції
        function deleteCustomStation(customIndex) {
            const actualIndex = defaultStations.length + customIndex;
            
            if (currentIndex === actualIndex) {
                stopButton.click();
            } else if (currentIndex > actualIndex) {
                currentIndex--;
            }

            customStations.splice(customIndex, 1);
            localStorage.setItem('custom_radio_stations', JSON.stringify(customStations));
            renderPlaylist();
        }

        // Початкова ініціалізація
        setupMediaSession();
        renderPlaylist();
    </script>
</body>
</html>
